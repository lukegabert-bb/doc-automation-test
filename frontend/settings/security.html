<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security · Settings</title>
  <link rel="stylesheet" href="security.css" />
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Security</h1>
      <p class="page-description">
        Add an extra layer of protection to your account with two-factor authentication.
      </p>
    </header>

    <section class="card">
      <div class="toggle-row">
        <label for="tfa-toggle">Two-factor authentication</label>
        <input type="checkbox" id="tfa-toggle" />
      </div>
      <button id="enable-tfa-btn" class="btn btn-primary" type="button">
        Enable two-factor authentication
      </button>
    </section>
  </main>
  <script src="security.js"></script>
</body>
</html>
